<div class="profile-container">
    <div class="update-header">
        <h1 class="update-title">UPDATE <span class="neon">PROFILE</span></h1>
        <p class="update-subtitle">Modify your account information below.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-section">
            <div class="section-label">IDENTITY</div>
            <div class="form-row-three">
                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <select formControlName="title" class="form-select"
                        [ngClass]="{ 'is-invalid': submitted && f['title'].errors }">
                        <option value="Mr">Mr</option>
                        <option value="Mrs">Mrs</option>
                        <option value="Miss">Miss</option>
                        <option value="Ms">Ms</option>
                    </select>
                    <div *ngIf="submitted && f['title'].errors" class="invalid-feedback">
                        Title is required
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" formControlName="firstName" class="form-control"
                        [ngClass]="{ 'is-invalid': submitted && f['firstName'].errors }" />
                    <div *ngIf="submitted && f['firstName'].errors" class="invalid-feedback">
                        First Name is required
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" formControlName="lastName" class="form-control"
                        [ngClass]="{ 'is-invalid': submitted && f['lastName'].errors }" />
                    <div *ngIf="submitted && f['lastName'].errors" class="invalid-feedback">
                        Last Name is required
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" formControlName="email" class="form-control"
                    [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" />
                <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
                    <div *ngIf="f['email'].errors['required']">Email is required</div>
                    <div *ngIf="f['email'].errors['email']">Email must be valid</div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="section-label">CHANGE PASSWORD <span class="section-hint">(leave blank to keep current)</span></div>
            <div class="form-row-two">
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" formControlName="password" class="form-control"
                        [ngClass]="{ 'is-invalid': submitted && f['password'].errors }" />
                    <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
                        <div *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" formControlName="confirmPassword" class="form-control"
                        [ngClass]="{ 'is-invalid': submitted && f['confirmPassword'].errors }" />
                    <div *ngIf="submitted && f['confirmPassword'].errors" class="invalid-feedback">
                        <div *ngIf="f['confirmPassword'].errors['mustMatch']">Passwords must match</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary" [disabled]="submitting">
                <span *ngIf="submitting" class="spinner-border spinner-border-sm"></span>
                UPDATE
            </button>
            <button type="button" class="btn-danger" (click)="onDelete()" [disabled]="deleting">
                <span *ngIf="deleting" class="spinner-border spinner-border-sm"></span>
                DELETE ACCOUNT
            </button>
            <a routerLink="../" class="btn-link">Cancel</a>
        </div>
    </form>
</div>
