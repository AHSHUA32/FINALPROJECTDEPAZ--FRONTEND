<!-- App Shell -->
<div class="app-shell" [class.sidebar-active]="sidebarOpen" *ngIf="account; else authLayout">

  <!-- Mobile Overlay -->
  <div class="sidebar-overlay" (click)="closeSidebar()"></div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">⬡</span>
      <span class="brand-name">DEPAZ<span class="brand-accent">SYS</span></span>
    </div>

    <div class="sidebar-user">
      <div class="user-avatar">{{ account?.firstName?.[0] }}{{ account?.lastName?.[0] }}</div>
      <div class="user-info">
        <div class="user-name">{{ account?.firstName }} {{ account?.lastName }}</div>
        <div class="user-role" [class.admin-role]="account?.role === Role.Admin">
          {{ account?.role === Role.Admin ? '⬡ ADMIN' : '◈ USER' }}
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}"
         class="nav-link" (click)="closeSidebar()">
        <span class="nav-icon">⌂</span><span class="nav-label">Dashboard</span>
      </a>
      <a routerLink="/profile" routerLinkActive="active"
         class="nav-link" (click)="closeSidebar()">
        <span class="nav-icon">◈</span><span class="nav-label">Profile</span>
      </a>
      <a *ngIf="account?.role === Role.Admin" routerLink="/admin" routerLinkActive="active"
         class="nav-link" (click)="closeSidebar()">
        <span class="nav-icon">⬡</span><span class="nav-label">Admin Panel</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button (click)="logout()" class="logout-btn">
        <span>⏻</span> Logout
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Top Bar -->
    <header class="topbar">
      <button class="hamburger" (click)="toggleSidebar()">
        <span></span><span></span><span></span>
      </button>
      <div class="topbar-title">
        <span class="topbar-dot"></span> SYSTEM ONLINE
      </div>
      <div class="topbar-time">{{ account?.email }}</div>
    </header>

    <router-outlet name="subnav"></router-outlet>
    <alert></alert>
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Auth Layout (login/register pages) -->
<ng-template #authLayout>
  <alert></alert>
  <router-outlet></router-outlet>
</ng-template>
