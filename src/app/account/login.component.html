<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">⬡</div>
      <h1 class="auth-title">SIGN IN</h1>
      <p class="auth-subtitle">Authenticate to access the system</p>
    </div>
    <div class="auth-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" formControlName="email" class="form-control"
            placeholder="user@example.com"
            [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" />
          <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
            <div *ngIf="f['email'].errors['required']">Email is required</div>
            <div *ngIf="f['email'].errors['email']">Enter a valid email</div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group-pw">
            <input [type]="showPw ? 'text' : 'password'" formControlName="password"
              class="form-control" placeholder="••••••••"
              [ngClass]="{ 'is-invalid': submitted && f['password'].errors }" />
            <button type="button" class="pw-toggle" (click)="showPw = !showPw">
              {{ showPw ? '🙈' : '👁' }}
            </button>
            <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
              <div *ngIf="f['password'].errors['required']">Password is required</div>
            </div>
          </div>
        </div>
        <button [disabled]="submitting" class="btn btn-primary btn-full">
          <span *ngIf="submitting" class="spinner-border spinner-border-sm"></span>
          {{ submitting ? 'Authenticating...' : 'Login' }}
        </button>
      </form>
    </div>
    <div class="auth-footer">
      <a routerLink="../register" class="btn btn-link">Create Account</a>
      <a routerLink="../forgot-password" class="btn btn-link">Forgot Password?</a>
    </div>
  </div>
</div>
