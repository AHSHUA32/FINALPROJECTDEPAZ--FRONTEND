<h3 class="card-header">Forgot Password</h3>
<div class="card-body">

    <div *ngIf="resetLink" class="reset-link-box">
        <div class="reset-link-icon">🔐</div>
        <p class="reset-link-title">RESET LINK GENERATED</p>
        <p class="reset-link-text">Click the link below to reset your password:</p>
        <a [href]="resetLink" class="reset-link-url">{{ resetLink }}</a>
        <p class="reset-link-note">NOTE: In a real app this link would be sent to your email.</p>
    </div>

    <form *ngIf="!resetLink" [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" formControlName="email" class="form-control"
                [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" />
            <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
                <div *ngIf="f['email'].errors['required']">Email is required</div>
                <div *ngIf="f['email'].errors['email']">Email is invalid</div>
            </div>
        </div>
        <div class="mb-3">
            <button [disabled]="loading" class="btn-primary">
                <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
                Submit
            </button>
            <a routerLink="../login" class="btn-link">Cancel</a>
        </div>
    </form>

</div>
